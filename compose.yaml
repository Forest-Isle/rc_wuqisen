services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mockvendor:
    build: .
    entrypoint: ["/usr/local/bin/mockvendor"]
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/healthz"]
      interval: 2s
      timeout: 2s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://notify:notify@postgres:5432/notify?sslmode=disable
      API_TOKEN: dev-only-token
      ALLOW_HTTP: "true"
      ALLOW_PRIVATE_TARGETS: "true"
      DESTINATION_ALLOWLIST: mockvendor
      INITIAL_BACKOFF: 100ms
      MAX_BACKOFF: 1s
      POLL_INTERVAL: 100ms
    depends_on:
      postgres:
        condition: service_healthy
      mockvendor:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  postgres-data:
